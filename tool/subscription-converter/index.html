<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>订阅转换 · 万能工具箱</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/toolbox-classic.svg">
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="./subscription.css">
  <script src="../../tools/vendor/js-yaml.umd.min.js" defer></script>
  <script src="../../tools/subscriptions.js" defer></script>
</head>
<body>
<main class="subscription">
  <a class="back" href="../../#tool-library">← 返回万能工具箱</a>
  <header class="subscription-header">
    <span class="subscription-mark" aria-hidden="true">⇄</span>
    <div><h1>订阅转换</h1><p>在浏览器里导入节点，按客户端格式导出。</p></div>
  </header>

  <noscript>请启用 JavaScript 使用订阅转换。</noscript>
  <div class="subscription-grid" inert aria-busy="true">
    <div class="subscription-source">
      <section class="subscription-panel" aria-labelledby="source-title">
        <h2 id="source-title">导入订阅</h2>
        <div class="subscription-row">
          <button id="choose-file" type="button">选择文件</button>
          <input type="file" id="source-file" accept=".yaml,.yml,.txt,.conf,.json" hidden>
          <button id="example" type="button">试用示例</button>
          <button id="clear" type="button">清空</button>
        </div>
        <label for="source">Clash YAML、分享链接或 Base64</label>
        <textarea id="source" rows="7" maxlength="8388608" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="粘贴内容或把文件拖到此处"></textarea>
        <details>
          <summary>读取订阅网址</summary>
          <label for="source-url">订阅网址</label>
          <div class="subscription-row subscription-url">
            <input id="source-url" type="url" autocomplete="off" spellcheck="false" placeholder="https://…">
            <button id="read-url" type="button">读取</button>
          </div>
          <p>浏览器直接向订阅服务器读取。若服务器限制网页访问，请先下载文件再导入。</p>
        </details>
        <div class="subscription-row">
          <button id="parse" class="subscription-primary" type="button">解析节点</button>
          <span id="source-status" class="subscription-status" role="status"></span>
        </div>
      </section>

      <section class="subscription-panel" aria-labelledby="saved-title">
        <h2 id="saved-title">我的订阅</h2>
        <p>保存后保留在当前浏览器，可勾选多个订阅一起导出。</p>
        <label for="saved-name">订阅名称</label>
        <div class="subscription-row subscription-url">
          <input id="saved-name" maxlength="80" autocomplete="off" placeholder="例如 家用订阅">
          <button id="save-source" type="button">保存当前内容</button>
        </div>
        <ul id="saved-list" class="subscription-nodes" aria-label="已保存订阅" hidden></ul>
        <div class="subscription-row">
          <button id="combine-sources" type="button" disabled>加载所选订阅</button>
          <span id="saved-status" class="subscription-status" role="status"></span>
        </div>
      </section>
      <section class="subscription-panel" aria-labelledby="nodes-title">
        <h2 id="nodes-title">选择节点</h2>
        <p id="node-status" class="subscription-status" role="status">解析后显示节点和兼容性。</p>
        <div id="node-controls" hidden>
          <label for="node-search">查找节点</label>
          <input id="node-search" type="search" autocomplete="off" placeholder="名称或协议">
          <div class="subscription-row">
            <button id="select-visible" type="button">选择筛选结果</button>
            <button id="deselect-visible" type="button">取消筛选结果</button>
          </div>
        </div>
        <ul id="nodes" class="subscription-nodes" aria-label="节点与兼容性" hidden></ul>
      </section>
    </div>

    <section class="subscription-panel subscription-output" aria-labelledby="output-title">
      <h2 id="output-title">导出配置</h2>
      <label for="format">客户端与格式</label>
      <select id="format">
        <option value="clash">Clash Verge / Mihomo · 完整配置</option>
        <option value="provider">Clash / Mihomo · 节点列表</option>
        <option value="base64">小火箭 · Base64 订阅</option>
        <option value="links">小火箭 · 明文分享链接</option>
        <option value="surge">Surge · 节点列表</option>
        <option value="loon">Loon · 节点列表</option>
        <option value="quanx">Quantumult X · 节点列表</option>
      </select>
      <p id="format-help"></p>
      <label for="prefix">节点名称前缀（可选）</label>
      <input id="prefix" maxlength="60" autocomplete="off" placeholder="例如 SG-">
      <div id="rules-row" class="subscription-rules">
        <label for="rules">规则方案</label>
        <select id="rules">
          <option value="standard">基础分流</option>
          <option value="acl">ACL4SSR Mini</option>
        </select>
        <small id="rules-status" class="subscription-status" role="status"></small>
      </div>
      <label id="split-row" class="subscription-check">
        <input type="checkbox" id="split" checked> 中国大陆和局域网直连
      </label>
      <label for="result">导出预览</label>
      <textarea id="result" rows="11" readonly spellcheck="false" placeholder="选择节点后可预览"></textarea>
      <div class="subscription-row">
        <button id="download" class="subscription-primary" type="button" disabled>下载</button>
        <button id="copy" type="button" disabled>复制</button>
        <span id="export-status" class="subscription-status" role="status"></span>
      </div>
    </section>
  </div>
  <footer class="subscription-footer">订阅凭据由浏览器处理。
    格式参考 <a href="https://github.com/pengchujin/tower" target="_blank" rel="noopener noreferrer">Tower</a> · <a href="./TOWER-LICENSE.txt">MIT 许可</a> · <a href="./ACL4SSR-NOTICE.txt">ACL4SSR 规则来源</a>
  </footer>
</main>
<script type="module" src="./subscription.mjs"></script>
</body>
</html>
