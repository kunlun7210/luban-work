name: Publish Universal Toolbox

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Refresh the Bing listing
        run: python3 scripts/refresh-bing.py
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir _site
          cp -a index.html sw.js register.js assets data static tool tools vip _site/
      - uses: actions/upload-pages-artifact@v4
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
