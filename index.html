<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>万能工具箱</title>
  <link rel="icon" href="./assets/toolbox-classic.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <script type="module" src="./assets/home.mjs"></script>
  <script src="./register.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img src="./assets/toolbox-classic.svg" width="32" height="32" alt=""><span><strong>万能工具箱</strong><small>TOOLBOX</small></span></a>
  <nav aria-label="主导航"><a href="#tool-library">工具</a></nav>
</header>
<main class="shell">
  <section class="hero">
    <h1><i></i> 万能工具箱 <span id="hero-count"></span></h1>
    <p id="intro"></p>
    <form class="search" role="search">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" aria-label="搜索工具" placeholder="搜索工具、关键词，或直接说出你想做什么" autocomplete="off">
      <button aria-label="搜索">↗</button>
    </form>
    <div class="hot"><strong>热门</strong><button>证件照</button><button>图片压缩</button><button>二维码</button><button>OCR</button><button>汇率</button></div>
  </section>
  <section id="recent" class="recent" hidden><div class="section-heading"><h2>最近打开</h2></div><div id="recent-cards" class="grid"></div></section>
  <section id="tool-library">
    <div class="section-heading"><span>工具库</span><h2>按分类找工具</h2></div>
    <div class="library">
      <aside id="sidebar" class="categories" aria-label="工具分类"></aside>
      <div class="listing">
        <div id="tabs" class="category-tabs" aria-label="工具分类"></div>
        <div id="results" role="status"></div>
        <div class="grid" id="cards"></div>
        <noscript>请启用 JavaScript 查看工具列表。</noscript>
      </div>
    </div>
  </section>
</main>
</body>
</html>
